{% extends 'base.html' %}
{% block title %}Acceso privado · Mente Segura{% endblock %}
{% block content %}
<main class="pin-screen">
    <div class="pin-leaf pin-leaf-one"></div>
    <div class="pin-leaf pin-leaf-two"></div>
    <section class="pin-content">
        <div class="lock-mark"><span></span></div>
        <h1>Acceso privado</h1>
        <p>Ingresa tu PIN para continuar</p>
        <form method="post" id="pin-form">
            <input class="pin-display" id="pin" name="pin" type="password" maxlength="4" inputmode="numeric" readonly autofocus>
            <div class="round-keypad">
                {% for key in ['1','2','3','4','5','6','7','8','9','0'] %}
                <button type="button" onclick="addKey('{{ key }}')">{{ key }}</button>
                {% endfor %}
                <button type="button" onclick="clearKey()">×</button>
            </div>
            <button class="pin-submit" type="submit">Entrar</button>
        </form>
        <a class="cancel-link" href="{{ url_for('hoy') }}">Cancelar</a>
    </section>
</main>
<script>
const input = document.getElementById('pin');
function addKey(k) {
    if (input.value.length < 4) input.value += k;
}
function clearKey() {
    input.value = input.value.slice(0, -1);
}
</script>
{% endblock %}
